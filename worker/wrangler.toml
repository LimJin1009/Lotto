# 로또 찐 번호 후기 서버 (Cloudflare Workers + D1)
# 올리는 법·관리: docs/후기서버.md
name = "lotto-reviews"
main = "src/index.mjs"
compatibility_date = "2025-09-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "lotto-reviews"
# 누나 Cloudflare 계정(dlawls3355)의 D1 lotto-reviews
database_id = "7244cf7d-e9dc-40fa-946c-0bed75e5441a"

# 알림 서명 공개키 (공개해도 됨). 비밀 열쇠 VAPID_PRIVATE_JWK·ADMIN_TOKEN 은 "wrangler secret" 에 있음 (PC 사본: .env.vapid)
[vars]
VAPID_PUBLIC = "BGWjqDTlWkuJON7Z5tzuK_xvKc8w-vcXlWC9hq9TZsLpFGhguqIOCNDPQyrPpdXsvvpGwA6dIyHfRCZnNXwYd9I"

# 당첨 알림: 토요일 21:00~23:59, 일요일 09:00~23:59 (한국 시간) 10분마다 확인. 크론은 UTC 기준
[triggers]
# 구매 알림: 토요일 18:00~18:59 (한국 시간) 10분마다, 한 번에 40개씩
crons = ["*/10 9 * * SAT", "*/10 12-14 * * SAT", "*/10 0-14 * * SUN"]
