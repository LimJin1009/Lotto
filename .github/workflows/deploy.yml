# GitHub Pages 배포
# - main에 올리면 배포
# - 매주 토요일 21:30·일요일 10:00(한국 시간)에 최신 당첨번호를 받아 다시 배포
name: 배포

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 12 * * 6'
    - cron: '0 1 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: 최신 당첨번호 받기
        run: npm run update-draws
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
